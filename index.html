<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#111c2e;--mut:#64748b;--line:#e2e8f0;--head:#f8fafc;--accent:#1e3a5f;--debt:#b42318;--debtbg:#fdecea;--ok:#067647;--okbg:#e7f6ee;--bar:#1e3a5f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111b2c;--ink:#e6edf7;--mut:#8b9ab0;--line:#1f2d42;--head:#15213a;--accent:#9fc0ea;--debt:#ff8a80;--debtbg:#3a1f1f;--ok:#6ee7a8;--okbg:#17332a;--bar:#9fc0ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#111b2c;--ink:#e6edf7;--mut:#8b9ab0;--line:#1f2d42;--head:#15213a;--accent:#9fc0ea;--debt:#ff8a80;--debtbg:#3a1f1f;--ok:#6ee7a8;--okbg:#17332a;--bar:#9fc0ea;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:960px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 48px)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mut)}
button{font:inherit;font-weight:600;padding:10px 14px;min-height:40px;-webkit-tap-highlight-color:transparent;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button[aria-current=page]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
input,select,textarea{font:inherit;color:var(--ink);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{margin:8px 0 0;color:var(--mut);font-size:13px}#msg:empty{display:none}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border-color:transparent;background:transparent;color:var(--mut);padding:7px 14px}
.tabs button[aria-current=page]{background:var(--ink);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:20px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.up{color:var(--debt)}.dn{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toolbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toolbar input{flex:1 1 220px}.toolbar select{width:auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;min-width:520px}
.t th,.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t thead th{background:var(--head);color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;cursor:pointer;user-select:none}
.t thead th[aria-sort]::after{content:" ↕";opacity:.5}
.t thead th[aria-sort=ascending]::after{content:" ↑";opacity:1}.t thead th[aria-sort=descending]::after{content:" ↓";opacity:1}
.t .n{text-align:right}
.t tbody tr.r{cursor:pointer}.t tbody tr.r:hover{background:var(--head)}
.t td.idx{color:var(--mut);width:44px}
.t td.nm{font-weight:600;min-width:200px}
.t td.nm em{display:block;font-style:normal;font-weight:500;font-size:12px;color:var(--mut)}
.t td.amt{font-weight:700}
.t tfoot td{font-weight:800;background:var(--head);border-bottom:0}
.track{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden;max-width:220px}
.track i{display:block;height:100%;background:var(--bar);border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.up{background:var(--debtbg);color:var(--debt)}.pill.dn{background:var(--okbg);color:var(--ok)}.pill.nw{background:var(--debtbg);color:var(--debt)}.pill.z{background:var(--line);color:var(--mut)}
tr.x td{background:var(--head);white-space:normal}
.hist{display:flex;gap:6px;align-items:flex-end;height:90px;max-width:520px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.hist i{display:block;width:100%;max-width:38px;background:var(--bar);opacity:.8;border-radius:4px 4px 0 0}
.hist b{color:var(--ink);font-weight:700;margin-bottom:2px}
.empty{padding:40px 16px;text-align:center}.empty p{color:var(--mut);max-width:44ch;margin:8px auto 16px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{margin:0 0 10px;font-size:14px;font-weight:700}
svg{width:100%;height:auto;display:block}
.warn{color:var(--debt);font-size:13px;margin:6px 0}
.lb{display:block;color:var(--mut);font-size:12px;font-weight:600;margin:12px 0 4px}
.r2{display:flex;gap:8px;margin-top:12px}.r2 button{flex:1}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
:root{--bg:#f4f6fa;--accent:#0f3d63;--ok:#0a7a4b;--bar:#0f3d63;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#7fb2e5;--bar:#7fb2e5;--shadow:none}}
:root[data-theme="dark"]{--accent:#7fb2e5;--bar:#7fb2e5;--shadow:none}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header.top{padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:22px}h1::before{content:"";display:inline-block;width:6px;height:20px;border-radius:3px;background:var(--accent);margin-right:10px;vertical-align:-3px}
.kpi,.card,.panel,.tabs{box-shadow:var(--shadow);border-radius:12px}
.kpi:first-child{border-left:4px solid var(--debt)}
button{transition:filter .15s,transform .05s}button:hover{filter:brightness(1.1)}button:active{transform:translateY(1px)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap}
.t thead th{border-bottom:2px solid var(--line)}.t td.amt{color:var(--debt)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:480px){.t th.hide-s,.t td.hide-s{display:none}table.t{min-width:0}.t td.nm{min-width:0;white-space:normal}}
.hist div[data-ek]{cursor:pointer;border-radius:6px}.hist div[data-ek]:hover i,.hist div[data-ek]:focus-visible i{opacity:1}.hist div[data-ek]:focus-visible{outline:2px solid var(--accent)}
.ekm{position:fixed;inset:0;background:rgba(8,15,28,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}

let mig=false;
async function migrate(){
  if(mig)return;const jobs=[];
  Object.keys(DB.months).forEach(m=>DB.months[m].people.forEach(p=>{if(p.ph)jobs.push([m,p])}));
  if(!jobs.length)return;mig=true;
  try{for(const [m,p] of jobs){const k=m+"|"+norm(p.n);
    
    if(p.ph&&p.ph.length){const old=(await IDB.get("p|"+k))||[];await IDB.set("p|"+k,old.concat(p.ph))}

}

async function flushRemote(){
  clearTimeout(rt);rt=null;

  dirty=false;
  try{await RDB.collection("data/users/"+RID).doc("defter").set({data:JSON.stringify(DB)});setSync("Veritabanına kaydedildi")}
  catch(e){dirty=true;setSync(e&&e.code=="quota_exceeded"?"Veritabanı dolu. Eski ayları sil.":"Kaydedilemedi, tekrar denenecek");rt=setTimeout(flushRemote,5000)}
}

}

(async()=>{
  try{
    const cl=window.claude;
    if(!cl){setSync("Yerel kayıt (veritabanı yok)");return}
    const db=await cl.use("db"),user=await cl.use("user");
    if(!db||!user){setSync("Yerel kayıt (veritabanı yok)");return}
    const id=await user.id();
    if(!id){setSync("Yerel kayıt (giriş yapılmamış)");return}
    RDB=db;RID=id;
    const snap=await db.collection("data/users/"+id).doc("defter").get();
    if(snap.exists){
      let r=null;try{r=JSON.parse(snap.data().data)}catch(e){}
      if(r&&r.months){
        const localNewer=(DB.saved||"")>(r.saved||"")&&Object.keys(DB.months).length>0;
        if(!localNewer){DB=r;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
      }
    }else if(keys().length){dirty=true;queueRemote()}
    setSync("Veritabanına bağlı");
    cur=null;render();
    let stale=false;
    const editing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$("v").contains(a))};
    const applyRemote=()=>{stale=false;if(!DB.months[cur])cur=null;open=null;render()};
    document.addEventListener("focusout",()=>{if(stale)setTimeout(()=>{if(stale&&!editing())applyRemote()},400)});
    db.collection("data/users/"+id).doc("defter").onSnapshot(s=>{
      if(!s.exists)return;
      let r=null;try{r=JSON.parse(s.data().data)}catch(e){}
      if(!r||!r.months||(r.saved||"")<=(DB.saved||""))return;
      DB=r;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
      setSync("Başka cihazdan güncellendi · "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}));
      if(editing())stale=true;else applyRemote();
    },()=>setSync("Canlı eşitleme durdu, sayfayı yenile"));
  }catch(e){setSync("Yerel kayıt")}
})();
const keys=()=>Object.keys(DB.months).sort();
const debt=p=>p.f<0?-p.f:0;
let tab="defter",cur=null,pending=null,q="",sk="debt",sd=-1,open=null,armed=null,showForm=false,fmode="o",fv={n:"",a:"",t:"",msg:""};
const note=t=>{$("msg").textContent=t||""};
const find=(arr,p)=>arr&&arr.find(y=>norm(y.s)==norm(p.s)||norm(y.n)==norm(p.n));

const r2=x=>Math.round(x*100)/100;
const parseAmt=v=>{const x=parseFloat(String(v||"").replace(/\./g,"").replace(",","."));return x>0?r2(x):0};
function fmtAmt(el){
  const v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart;
  const before=v.slice(0,pos).replace(/[^\d,]/g,"").length;
  const s=v.replace(/[^\d,]/g,""),i=s.indexOf(",");
  let ip=i<0?s:s.slice(0,i);const dp=i<0?null:s.slice(i+1).replace(/,/g,"").slice(0,2);
  ip=ip.replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g,".");
  const out=dp===null?ip:ip+","+dp;
  el.value=out;
  let c=0,n=0;while(c<out.length&&n<before){if(out[c]!==".")n++;c++}
  try{el.setSelectionRange(c,c)}catch(e){}
}
document.addEventListener("input",e=>{const t=e.target;if(t&&(t.id=="ea"||(t.classList&&t.classList.contains("pi"))))fmtAmt(t)});
function curMonthKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;e.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)";document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function addEntry(name,kind,amt,nt,k){
  name=up(name||"");
  if(!name)return{ok:false,msg:"Ad gir."};
  if(!amt)return{ok:false,msg:"Tutar gir."};
  k=k||cur||curMonthKey();
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(k))return{ok:false,msg:"Ay seç."};
  if(kind=="o"&&!DB.months[k])return{ok:false,msg:lab(k)+" için kayıt yok."};
  if(!DB.months[k])DB.months[k]={at:new Date().toISOString(),file:"Elle giriş",people:[]};
  const m=DB.months[k];
  let p=find(m.people,{s:name,n:name}),extra="";
  if(kind=="o"){
    if(!p||p.f>=0)return{ok:false,msg:name+" için kayıtlı borç yok."};
    if(amt>-p.f){extra=" Borçtan fazla kısım ("+tl(amt+p.f)+") yazılmadı.";amt=r2(-p.f)}
    p.f=r2(p.f+amt);
  }else{
    if(!p){p={s:name,n:name,f:0,m:1};m.people.push(p)}
    p.f=r2(p.f-amt);
  }

  persist();cur=k;open=p.n;
  return{ok:true,msg:(kind=="o"?"Ödeme düşüldü: ":"Borç yazıldı: ")+p.n+" "+tl(amt)+" ("+lab(k)+"). Kalan borç: "+tl(debt(p))+"."+extra};
}
function undoEntry(n,t){
  const m=DB.months[cur];if(!m)return;
  const p=find(m.people,{s:n,n:n});if(!p||!p.h)return;
  const i=p.h.findIndex(x=>x.t==t);if(i<0)return;
  const e=p.h[i];p.f=r2(p.f+(e.k=="o"?-e.a:e.a));p.h.splice(i,1);
  if(p.m&&!p.h.length&&!p.f)m.people.splice(m.people.indexOf(p),1);

}

function bindEntry(){

  const ek=$("ek");if(ek){ek.onchange=()=>{fv.n=$("en").value;fv.a=$("ea").value;fv.t=$("et").value;fv.k=ek.value||cur;fv.msg="";render()};["en","ea","et"].forEach(i=>$(i).onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();$("es").click()}})}

function compare(k){
  const ks=keys(),i=ks.indexOf(k),pk=i>0?ks[i-1]:null;
  const cp=DB.months[k].people,pp=pk?DB.months[pk].people:null;
  const rows=cp.filter(p=>p.f<0).map(p=>{const pr=find(pp,p),pd=pr?debt(pr):0,d=debt(p);return{p,d,pd,delta:d-pd,isNew:!!pp&&pd==0}});
  const closed=pp?pp.filter(x=>x.f<0&&!(find(cp,x)&&find(cp,x).f<0)).map(x=>({p:x,pd:-x.f,delta:x.f})):[];
  const total=rows.reduce((s,r)=>s+r.d,0),ptotal=pp?pp.reduce((s,x)=>s+debt(x),0):null;
  return{pk,rows,closed,total,ptotal,ks,i};
}
function delta(d,pl){
  if(d==null||pl==null)return"";
  if(!d)return`<span class="pill z">değişmedi</span>`;
  const pc=pl?" · %"+new Intl.NumberFormat("tr-TR",{maximumFractionDigits:1}).format(Math.abs(d)/pl*100):"";
  return d>0?`<span class="pill up">▲ ${tl(d)}${pc}</span>`:`<span class="pill dn">▼ ${tl(-d)}${pc}</span>`;
}

function kpis(c){
  const top=c.rows.slice().sort((a,b)=>b.d-a.d)[0];
  const d=c.pk?c.total-c.ptotal:null;
  return`<div class="kpis">
  <div class="kpi"><span>Toplam alacak</span><b>${tl(c.total)}</b><small>${c.rows.length} kişi borçlu</small></div>
  <div class="kpi"><span>Önceki aya göre</span><b class="${d>0?"up":d<0?"dn":""}">${d==null?"—":(d>0?"+":d<0?"−":"")+tl(Math.abs(d))}</b><small>${c.pk?lab(c.pk)+" "+tl(c.ptotal):"Karşılaştırma yok"}</small></div>
  <div class="kpi"><span>En büyük borç</span><b>${top?esc(top.p.n):"—"}</b><small>${top?tl(top.d):""}</small></div>
  <div class="kpi"><span>Yeni borçlu</span><b>${c.pk?c.rows.filter(r=>r.isNew).length:"—"}</b><small>${c.pk?"bu ay ilk kez":"ilk ay"}</small></div></div>`;
}
function viewDefter(){

  <th data-s="idx" class="hide-s">#</th><th data-s="az" aria-sort="none">Ad</th><th data-s="debt" class="n" aria-sort="none">Bu ay</th><th data-s="prev" class="n hide-s" aria-sort="none">Önceki ay</th><th data-s="delta" class="n" aria-sort="none">Değişim</th>
  </tr></thead><tbody id="tb"></tbody><tfoot><tr><td class="hide-s"></td><td>Toplam</td><td class="n">${tl(c.total)}</td><td class="n hide-s">${c.pk?tl(c.ptotal):"—"}</td><td class="n">${c.pk?(c.total-c.ptotal>0?"+":"")+tl(c.total-c.ptotal):"—"}</td></tr></tfoot></table></div></div>`;
  const draw=()=>{
    const Q=norm(q);
    let L=c.rows.filter(r=>norm(r.p.n).includes(Q));
    const key={az:(a,b)=>a.p.n.localeCompare(b.p.n,"tr"),debt:(a,b)=>a.d-b.d,prev:(a,b)=>a.pd-b.pd,delta:(a,b)=>a.delta-b.delta,idx:(a,b)=>0}[sk];
    L.sort((a,b)=>sd*key(a,b));
    if(sk=="debt"&&sd==-1){} 
    const max=Math.max(...c.rows.map(r=>r.d),1);
    $("tb").innerHTML=L.map((r,i)=>{
      const id=c.rows.indexOf(r),isOpen=open===r.p.n;
      return`<tr class="r" data-n="${esc(r.p.n)}" tabindex="0" aria-expanded="${isOpen}"><td class="idx hide-s">${i+1}</td>
      <td class="nm">${esc(r.p.n)}<div class="track"><i style="width:${Math.max(2,r.d/max*100)}%"></i></div></td>
      <td class="n amt">${tl(r.d)}</td><td class="n hide-s">${c.pk?tl(r.pd):"—"}</td>
      <td class="n">${c.pk?(r.isNew?'<span class="pill nw">yeni</span>':delta(r.delta,r.pd)):'<span class="pill z">—</span>'}</td></tr>`+
      (isOpen?`<tr class="x"><td colspan="5">${histOf(r.p)}</td></tr>`:"");
    }).join("")||`<tr><td colspan="5" style="color:var(--mut);padding:18px">${c.rows.length?"Eşleşen kişi yok.":"Bu ay borcu olan kimse yok."}</td></tr>`;
    document.querySelectorAll("th[data-s]").forEach(th=>{const on=th.dataset.s==sk;th.setAttribute("aria-sort",on?(sd>0?"ascending":"descending"):"none")});
  };
  $("q").oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(s==sk)sd=-sd;else{sk=s;sd=s=="az"?1:-1}draw()});
  $("tb").onclick=e=>{const eb=e.target.closest("[data-ek]");if(eb){openEkstre(eb.dataset.n,eb.dataset.ek);return}const tr=e.target.closest("tr.r");if(!tr)return;const n=tr.dataset.n;open=open===n?null:n;draw()};
  $("tb").onkeydown=e=>{const eb=e.target.closest("[data-ek]");if(eb&&(e.key=="Enter"||e.key==" ")){e.preventDefault();openEkstre(eb.dataset.n,eb.dataset.ek);return}if(e.key=="Enter"){const tr=e.target.closest("tr.r");if(tr){open=open===tr.dataset.n?null:tr.dataset.n;draw()}}};
  draw();bindEntry();
}
function ekData(n,k){
  const ks=keys(),all=[];let st=false;
  ks.forEach(m=>{const x=find(DB.months[m].people,{s:n,n:n});if(x)st=true;if(st)all.push({k:m,x,d:x?debt(x):0})});
  all.forEach((r,i)=>{r.pd=i?all[i-1].d:null});
  const c=all.find(r=>r.k==k);if(!c)return null;
  const h=((c.x&&c.x.h)||[]).slice().sort((a,b)=>a.t-b.t);
  return{all,c,h};
}
const dl=(d,pd)=>pd==null?"—":(d==pd?"değişmedi":(d>pd?"+ ":"− ")+tl(Math.abs(d-pd)));
function ekText(n,k){

  return["EKSTRE — "+n,"Dönem: "+lab(k),"","Devir: "+(c.pd==null?"—":tl(c.pd)),"Bu ay borcu: "+tl(c.d),"Değişim: "+dl(c.d,c.pd)]

   .concat(["","Tüm aylar:"],D.all.map(r=>lab(r.k)+": "+tl(r.d))).join("\n");
}

function pickPhoto(cb){
  const i=document.createElement("input");i.type="file";i.accept="image/*";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
    im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL("image/jpeg",.6))};
    im.onerror=()=>toast("Görüntü okunamadı.");im.src=u};
  i.click();
}
const pk=(k,n)=>{const m=DB.months[k],r=m&&find(m.people,{s:n,n:n});return norm(r?r.n:n)};
async function addPhoto(n,k,d){
  try{const key="p|"+k+"|"+pk(k,n),old=(await IDB.get(key))||[];old.push({t:Date.now(),d});await IDB.set(key,old);return true}catch(e){return false}
}
function sheetHtml(sn,man,cur){const onDay=d=>(man||[]).filter(e=>new Date(e.t).getDate()==d);const ent=e=>(e.k=="o"?"ÖDEME − ":"BORÇ + ")+tl(e.a)+(e.n?" · "+esc(e.n):"");

function parseWb(wb,file){
  const people=[],skipped=[],votes={},xm={};

    let fi=-1,di=-1;
    rows.forEach((r,i)=>{const k=norm(r[0]);if(k.startsWith("AYLIK FARKI"))fi=i;else if(k.startsWith("DEVIR")&&di<0)di=i});
    if(fi<0){if(norm(sn)!="RAPORLAR")skipped.push(sn.trim());return}
    const f=rows[fi][1];if(typeof f!="number"){skipped.push(sn.trim());return}
    const nm=di>0&&typeof rows[di-1][0]=="string"&&rows[di-1][0].trim()?rows[di-1][0]:sn;
    if(di>=0)rows[di].forEach((v,j)=>{if(j>1&&typeof v=="number"&&v>40000&&v<60000){const d=XLSX.SSF.parse_date_code(v),k=d.y+"-"+String(d.m).padStart(2,"0");votes[k]=(votes[k]||0)+1}});

  return{file,people,skipped,month:month||"",xm};
}
